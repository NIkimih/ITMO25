<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container text-center">
      <div class="row">
        <div class="container">
          <div class="row">
            <button id="start" class="btn btn-success p-2">Начать</button>
            <button id="finish" class="hidden btn btn-danger p-2">
              Завершить
            </button>
            <div id="board">
              <div id="timer"></div>
              <div class="math-exp row justify-content-center">
                <div id="first-num" class="col-auto"></div>
                <div id="effect" class="col-auto"></div>
                <div id="second-num" class="col-auto"></div>
                <div id="equality" class="col-auto">=</div>
                <div id="equality" class="col-auto">***</div>
              </div>
              <div class="row justify-content-center p-2">
                <input id="ans-num" type="number" class="col-auto" />
              </div>
            </div>
            <button type="submit" id="ans-but" class="btn btn-success">
              Отправить (жми Enter)
            </button>
          </div>
        </div>
        <div class="container" id="finish-window">
          <div class="row">
            <div class="c-finish-window">
              <div><p>Игра завершена</p></div>
              <div>
                <p>Кол-во ответов:</p>
                <p id="count-true-ans"></p>
              </div>
              <div class="p-2">
                <button id="again" class="btn btn-success">Начать</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="script.js" type="module"></script>
  </body>
</html>
